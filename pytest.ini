[pytest]
pythonpath = .
testpaths = tests
addopts = -v --html=results/report.html --self-contained-html
markers =
    smoke: chạy nhanh trước khi chạy full
    regression: bộ hồi quy
    high: test case ưu tiên cao
    medium: test case ưu tiên trung bình
    low: test case ưu tiên thấp
    security: kiểm tra bảo mật và điều hướng

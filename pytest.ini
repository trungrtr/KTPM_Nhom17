[pytest]
pythonpath = .
testpaths = tests
addopts = -v --html=results/report.html --self-contained-html
markers =
    smoke: test nhanh trước khi chạy full
    regression: bộ hồi quy
    high: test case ưu tiên cao
    medium: test case ưu tiên trung bình
    security: kiểm thử bảo mật và điều hướng phiên
    pdp: kiểm thử chi tiết sản phẩm
    manual: kiểm thử thủ công
